<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sistema Académico</title><link rel="stylesheet" href="/styles.css?v=turquesa-negro-3"><script defer src="/vendor/lucide.min.js?v=0.468.0"></script><script defer src="/app.js?v=dashboard-2"></script></head>
<body>
<section id="login" class="login"><form id="login-form"><i data-lucide="graduation-cap" class="brand-icon"></i><h1>Sistema Académico</h1><label>Usuario<input name="usuario" autocomplete="username" required></label><label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert" class="error"></p><button type="submit" class="primary">Iniciar sesión <i data-lucide="arrow-right"></i></button></form></section>
<div id="app" class="shell" hidden><aside><div class="brand"><i data-lucide="graduation-cap"></i><strong>Sistema Académico</strong></div><nav id="navigation" aria-label="Módulos académicos"></nav><div class="account"><span id="user"></span><button id="logout" class="icon-button" title="Cerrar sesión" aria-label="Cerrar sesión"><i data-lucide="log-out"></i></button></div></aside>
<main><header><div><p class="eyebrow">GESTIÓN ACADÉMICA</p><h1 id="title">Inicio / Resumen</h1></div><button id="refresh" class="icon-button" title="Actualizar" aria-label="Actualizar"><i data-lucide="refresh-cw"></i></button></header><p id="notice" role="status" aria-live="polite"></p>
<section id="summary" hidden></section>
<section id="records" hidden><div class="toolbar"><label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="Buscar registros" aria-label="Buscar registros"></label><span id="count"></span><button id="create" class="primary"><i data-lucide="plus"></i>Agregar</button></div><div id="data-table" class="table-scroll" tabindex="0" aria-label="Registros"></div><div class="pagination"><button id="previous" class="icon-button" title="Página anterior" aria-label="Página anterior"><i data-lucide="chevron-left"></i></button><span id="page-label"></span><button id="next" class="icon-button" title="Página siguiente" aria-label="Página siguiente"><i data-lucide="chevron-right"></i></button></div></section>
<section id="reports" hidden><form id="report-form" class="report-controls"><label>Reporte<select id="report-type"><option value="historial-estudiante">Historial de estudiante</option><option value="lista-seccion">Lista de sección</option><option value="carga-docente">Carga docente</option></select></label><label>Registro<select id="report-target" required></select></label><button class="primary" type="submit"><i data-lucide="file-search"></i>Consultar</button></form><div id="report-result"></div></section>
</main></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" id="close-editor" class="icon-button" title="Cerrar" aria-label="Cerrar"><i data-lucide="x"></i></button></div><div id="fields" class="fields"></div><p id="editor-error" class="error" role="alert"></p><footer><button type="button" id="cancel-editor">Cancelar</button><button id="save" class="primary" type="submit"><i data-lucide="save"></i>Guardar</button></footer></form></dialog>
<dialog id="confirmation" aria-labelledby="confirmation-title"><form id="confirmation-form"><h2 id="confirmation-title">Confirmar operación</h2><p id="confirmation-text"></p><p id="confirmation-error" class="error" role="alert"></p><footer><button type="button" id="cancel-confirmation">Volver</button><button id="confirm" class="danger" type="submit">Confirmar</button></footer></form></dialog>
</body></html>
